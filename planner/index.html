<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solo Leveling: ARISE OVERDRIVE - Talent Planner</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="eyebrow">Solo Leveling: ARISE OVERDRIVE</span>
          <h1>Talent Planner</h1>
        </div>
        <div class="top-actions" aria-label="Actions du build">
          <button id="resetBuild" class="ghost-button" type="button" title="Réinitialiser le build">Reset</button>
          <button id="importBuild" class="ghost-button" type="button" title="Importer un build JSON">Importer</button>
          <button id="exportBuild" class="ghost-button" type="button" title="Exporter le build JSON">Exporter</button>
          <button id="shareBuild" class="primary-button" type="button" title="Copier un lien partageable">Partager</button>
          <input id="importFile" type="file" accept="application/json" hidden>
        </div>
      </header>

      <main class="workspace">
        <section class="tree-panel" aria-label="Arbre de talents">
          <div class="control-strip">
            <label>
              Système
              <select id="systemSelect"></select>
            </label>
            <label>
              Arbre
              <select id="sectionSelect"></select>
            </label>
            <label class="budget-control">
              Budget
              <input id="budgetInput" type="number" min="0" step="1">
            </label>
            <div class="zoom-controls" aria-label="Zoom">
              <button id="zoomOut" type="button" title="Réduire le zoom">-</button>
              <button id="zoomIn" type="button" title="Augmenter le zoom">+</button>
              <button id="zoomReset" type="button" title="Réinitialiser le zoom">1:1</button>
            </div>
          </div>

          <div id="notice" class="notice" role="status"></div>

          <div id="treeViewport" class="tree-viewport">
            <div id="treeCanvas" class="tree-canvas">
              <svg id="edgeLayer" class="edge-layer" aria-hidden="true"></svg>
              <div id="nodeLayer" class="node-layer"></div>
            </div>
          </div>
        </section>

        <aside class="side-panel" aria-label="Résumé du build">
          <section class="panel-block">
            <div class="block-title">
              <h2>Build</h2>
              <span id="buildCount" class="pill">0 talents</span>
            </div>
            <div id="budgetSummary" class="budget-summary"></div>
          </section>

          <section class="panel-block">
            <div class="block-title">
              <h2>Talent</h2>
              <span id="activeRank" class="pill muted">-</span>
            </div>
            <div id="nodeDetails" class="node-details"></div>
          </section>

          <section class="panel-block">
            <div class="block-title">
              <h2>Gains connus</h2>
            </div>
            <div id="knownGains" class="gain-list"></div>
          </section>

          <section class="panel-block">
            <div class="block-title">
              <h2>Valeurs brutes</h2>
            </div>
            <div id="rawEffects" class="gain-list compact"></div>
          </section>

          <section class="panel-block">
            <div class="block-title">
              <h2>Sélection</h2>
            </div>
            <div id="selectionList" class="selection-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
