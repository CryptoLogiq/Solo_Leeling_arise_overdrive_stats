<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=planner/">
    <title>Solo Leveling: ARISE OVERDRIVE - Talent Planner</title>
    <link rel="canonical" href="planner/">
    <style>
      :root {
        color-scheme: dark;
        --bg: #11100e;
        --panel: #1d1b17;
        --line: #786b55;
        --text: #f4efe4;
        --muted: #b8ad9d;
        --gold: #f0ca73;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #11100e;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
        padding: 1.25rem;
        border: 1px solid rgba(240, 202, 115, 0.28);
        border-radius: 8px;
        background: var(--panel);
      }

      h1 {
        margin: 0 0 0.65rem;
        font-size: 1.35rem;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
      }

      a {
        color: var(--gold);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Talent Planner</h1>
      <p>Redirection vers <a href="planner/">le planner Solo Leveling: ARISE OVERDRIVE</a>.</p>
    </main>
  </body>
</html>
